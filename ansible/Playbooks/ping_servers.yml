- name: Working with Linux
  hosts: linux 
  gather_facts: false
  become: true
  tasks:
    - name: check connectivity
      ansible.builtin.ping:

    - name: install postgresql server
      ansible.builtin.dnf:
        name: postgresql15-server
        state: present

    - name: Start postgresql server
      ansible.builtin.service:
        name: postgresql15-server
        state: started
        enabled: true

