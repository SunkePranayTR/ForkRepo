---  
- name: Linux nodes - connectivity + PostgreSQL
  hosts: linux
  gather_facts: true
  become: true
  tasks:
    - name: ping linux servers over ssh
      ansible.builtin.ping:

    - name: install postgresql server
      ansible.builtin.dnf:
        name: postgresql15-server     # <-- versioned name (not "postgresql")
        state: present

    - name: initialize the database (first run only)
      ansible.builtin.command: postgresql-setup --initdb
      args:
        creates: /var/lib/pgsql/data/PG_VERSION

    - name: start and enable postgresql
      ansible.builtin.service:
        name: postgresql
        state: started
        enabled: true
