---
- name: ping linux Servers
  ansible.builtin.ping:

- name: install java on linux
  ansible.builtin.dnf:
    name: java-17-amazon-corretto
    state: present

- name: install postgresql on linux
  ansible.builtin.dnf:
    name: postgresql15-server
    state: present

- name: setup postgresql server
  ansible.builtin.command: postgresql-setup --initdb
  args:
    creates: /var/lib/pgsql/data/PG_VERSION

- name: start postgresql on linux
  ansible.builtin.service:
    name: postgresql
    state: started
    enabled: true
  notify: 
    - Check_handlers
    - restart_postgresql

- name: Deploy index html on Linux Servers
  ansible.builtin.copy:
    src: "{{index_src}}"
    dest: "{{index_dest}}"
    owner: "{{deploy_owner}}"
    mode: "{{file_mode}}"