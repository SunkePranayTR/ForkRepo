---
- name: ping linux Servers
  ansible.builtin.ping:

- name: install java on linux
  ansible.builtin.dnf:
    name: java-17-amazon-corretto
    state: present

- name: install postgresql on linux
  ansible.builtin.dnf:
    name: postgresql15-server
    state: present

- name: setup postgresql server
  ansible.builtin.command: postgresql-setup --initdb
  args:
    creates: /var/lib/pgsql/data/PG_VERSION

- name: start postgresql on linux
  ansible.builtin.service:
    name: postgresql
    state: started
    enabled: true
  notify: 
    - Check_handlers
    - restart_postgresql

- name: install httpd on linux servers
  ansible.builtin.dnf:
    name: "{{web_package}}"
    state: present

- name: Start httpd service on linux servers
  ansible.builtin.service:
    name: "{{web_service}}"
    state: started
    enabled: true

