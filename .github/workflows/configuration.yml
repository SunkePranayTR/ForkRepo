name: Configuration using Ansible

on: 
  push:
    branches:
      - ansible-16062026
  workflow_dispatch:

  
jobs:
  test:
    runs-on: ansible-1

    steps:
      - name: Test print 
        run: |
          echo "Hello world"

      - name: install Ansible
        run: |
          python3 -m pip install --user ansible pywinrm
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Display Ansible version
        run: |
          ansible --version

      - name: check the ssh id
        run: which ssh-copy-id

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Windows collection
        run: ansible-galaxy collection install ansible.windows

      - name: Run win_ping playbook
        env:
          WINDOWS_USER: ${{ secrets.WINDOWS_USER }}
          WINDOWS_PASSWORD: ${{ secrets.WINDOWS_PASSWORD }}
        run: |
          cd ansible
          ansible-playbook -i inventory/hosts.ini Playbooks/win_ping.yml



        
        

          
    
