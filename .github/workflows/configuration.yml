name: configure the Servers using Ansible - Playbook {{ github.run_number }}

on:
  push:
    branches:
      - ansible-16062026

  workflow_dispatch:

jobs:
  ansible-connectivity:
    runs-on: ansible-1

    steps:
      - name: checkout repo
        uses: actions/checkout@v4

      - name: Install ansible-1
        run: python3 -m pip install ansible

      - name: Display Ansible Version
        run: ansible --version

      - name: install boto3 
        run: pip install boto3

      - name: install aws collections from ansible-galaxy
        run: ansible-galaxy collection install amazon.aws

      # Working with AWS to create instances and run userdata for windows

      - name: check AWS connection
        run: ansible localhost -m amazon.aws.aws_caller_info

      # - name: Bake Linux AMI with Packer
      #   run: |
      #     set -eo pipefail
      #     # install packer without sudo (single binary into ~/bin, unzip via python)
      #     PACKER_VERSION=1.11.2
      #     curl -fsSL -o /tmp/packer.zip "https://releases.hashicorp.com/packer/${PACKER_VERSION}/packer_${PACKER_VERSION}_linux_amd64.zip"
      #     mkdir -p "$HOME/bin"
      #     python3 -m zipfile -e /tmp/packer.zip "$HOME/bin/"
      #     chmod +x "$HOME/bin/packer"
      #     export PATH="$HOME/bin:$PATH"

      #     cd packer
      #     packer init .
      #     packer build . 2>&1 | tee /tmp/packer_build.log
      #     # capture the baked AMI id into a single variable (last ami- in the log = the new one)
      #     AMI_ID=$(grep -oE 'ami-[0-9a-f]+' /tmp/packer_build.log | tail -1)
      #     echo "Baked Linux AMI: $AMI_ID"
      #     # persist it so the next step's ansible can read it via lookup('env','LINUX_AMI')
      #     echo "LINUX_AMI=$AMI_ID" >> "$GITHUB_ENV"

      - name: Create ec2 instnaces using Ansible
        env:
          WINDOWS_PASSWORD: ${{ secrets.WINDOWS_PASSWORD }}
        run: |
          cd ansible
          ansible-playbook -i inventory/hosts.ini Playbooks/create_ec2.yml

      - name: call playbook
        env:
          WINDOWS_USER: ${{ secrets.WINDOWS_USER }}
          WINDOWS_PASSWORD: ${{ secrets.WINDOWS_PASSWORD }}
        run: |
          cd ansible
          ansible-playbook -i inventory/hosts.ini Playbooks/configure_deploy.yml





